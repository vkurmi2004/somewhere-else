<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain Room | Somewhere Else</title>
    <meta name="description" content="Let everything be quiet for a while.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/rain.css">
</head>
<body>
    
    <header class="room-header">
        <a href="../index.html" class="leave-link" aria-label="Leave Rain Room">
            <span class="arrow">&larr;</span> Leave Room
        </a>
        <button id="settings-toggle" class="settings-toggle" aria-label="Toggle Settings" aria-expanded="false" aria-controls="settings-panel">
            <span class="icon">⋮</span>
        </button>
    </header>

    <div id="settings-panel" class="settings-panel fade-in hidden" aria-hidden="true">
        <div class="setting-group">
            <label for="volume-control">Rain Volume</label>
            <input type="range" id="volume-control" min="0" max="100" value="50" aria-label="Rain Volume">
        </div>
        <div class="setting-group">
            <span class="label-text">Thunder</span>
            <button id="thunder-toggle" class="btn-toggle" aria-pressed="false">OFF</button>
        </div>
        <div class="setting-group">
            <span class="label-text">Night Sounds</span>
            <button id="night-sounds-toggle" class="btn-toggle" aria-pressed="false">OFF</button>
        </div>
        <div class="setting-group">
            <span class="label-text">Timer</span>
            <div class="timer-options">
                <button class="timer-btn" data-time="5">5m</button>
                <button class="timer-btn" data-time="10">10m</button>
                <button class="timer-btn" data-time="20">20m</button>
                <button class="timer-btn active" data-time="infinity">∞</button>
            </div>
        </div>
    </div>

    <main class="room-container" id="room-container">
        <!-- Moon in the sky (behind rain) -->
        <div class="moon-container" aria-hidden="true">
            <img src="../assets/moon.jpg" alt="" class="moon-img" id="moon-img">
            <div class="moon-halo"></div>
        </div>

        <!-- The window pane overlay -->
        <div class="window-overlay" aria-hidden="true">
            <div class="city-lights"></div>
            <div class="condensation"></div>
            <div class="window-frame"></div>
        </div>

        <!-- Lightning flash overlay triggered on touch -->
        <div class="lightning-overlay" id="lightning-overlay" aria-hidden="true"></div>

        <canvas id="rain-canvas" aria-label="Animation of rain falling outside a window"></canvas>
        
        <div id="initial-message" class="initial-message fade-in">
            <p>Touch the window.</p>
        </div>

        <div class="completion-modal fade-in hidden" id="completion-modal" aria-live="polite">
            <h2 class="completion-text">Take your time.</h2>
            <div class="completion-actions">
                <button class="btn-primary" id="btn-stay">Stay here</button>
                <a href="../index.html" class="btn-secondary">Leave</a>
            </div>
        </div>
    </main>

    <script src="../js/rain.js"></script>
</body>
</html>
