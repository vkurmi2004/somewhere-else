<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Room | Somewhere Else</title>
    <meta name="description" content="A quiet underwater dream. Just pop a few bubbles.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/bubbles.css">
</head>
<body>
    
    <header class="room-header">
        <a href="../index.html" class="leave-link" aria-label="Leave Bubble Room">
            <span class="arrow">&larr;</span> Leave Room
        </a>
        <button id="sound-toggle" class="sound-toggle" aria-label="Toggle Sound" aria-pressed="false">
            <span class="icon">🔇</span>
        </button>
    </header>

    <main class="room-container" id="bubble-container" aria-label="Interactive Bubble Environment">
        <!-- Bubbles will be injected here via JavaScript -->
        
        <div class="completion-modal fade-in hidden" id="completion-modal" aria-live="polite">
            <h2 class="completion-text">Nice.</h2>
            <p class="completion-subtext">Stay a little longer?</p>
            <div class="completion-actions">
                <button class="btn-primary" id="btn-again">Again</button>
                <a href="../index.html" class="btn-secondary">Explore another room</a>
            </div>
        </div>
    </main>

    <script src="../js/bubbles.js"></script>
</body>
</html>
